<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Macro Tuner</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --col:    #222;
  --col-dim: #333;
  --col-text: #eee;
  --col-sub: rgba(238,238,238,0.45);
  --col-bg: #0d0d0d;
  --transition: 0.6s ease;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  background: var(--col-bg);
  color: var(--col-text);
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 1.5rem;
  overflow: hidden;
}

/* Ambient colour glow behind everything */
.glow {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(ellipse at 50% 40%, var(--col-dim) 0%, transparent 70%);
  opacity: 0; transition: opacity 0.4s ease;
}
.glow.active { opacity: 0.18; }

.app {
  position: relative; z-index: 1;
  width: 100%; max-width: 420px;
  display: flex; flex-direction: column; gap: 12px;
}

/* Header */
.header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 4px;
}
.title { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: #444; }
.colour-badge {
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  padding: 3px 10px; border-radius: 20px;
  border: 1px solid var(--col-dim);
  color: var(--col);
  transition: all var(--transition);
  opacity: 0;
}
.colour-badge.active { opacity: 1; }

/* Main card */
.card {
  background: #151515;
  border: 1px solid #222;
  border-radius: 18px;
  padding: 28px 24px 24px;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.card.active {
  border-color: var(--col-dim);
  box-shadow: 0 0 40px rgba(0,0,0,0.6), 0 0 0 1px var(--col-dim);
}

/* Degree + note display */
.display-row {
  display: flex; align-items: flex-end; justify-content: center;
  gap: 16px; margin-bottom: 6px;
  min-height: 80px;
}
.note-big {
  font-size: 72px; font-weight: 500; line-height: 1;
  color: var(--col-text);
  transition: color var(--transition);
  letter-spacing: -2px;
  min-width: 80px; text-align: center;
}
.note-big.active { color: var(--col); }

.degree-info {
  display: flex; flex-direction: column; align-items: flex-start;
  padding-bottom: 10px; gap: 3px;
}
.degree-num {
  font-size: 13px; font-weight: 600;
  color: var(--col); opacity: 0;
  transition: all var(--transition);
  letter-spacing: 0.05em;
}
.degree-num.active { opacity: 1; }
.degree-label {
  font-size: 11px; color: #444;
  transition: color var(--transition);
  white-space: nowrap;
}
.degree-label.active { color: #666; }

/* Frequency */
.freq-row {
  text-align: center; font-size: 12px; color: #444;
  margin-bottom: 20px; min-height: 16px;
  transition: color var(--transition);
  letter-spacing: 0.05em;
}
.freq-row.active { color: #666; }

/* Meter */
.meter-wrap { margin-bottom: 10px; }
.meter-labels {
  display: flex; justify-content: space-between;
  margin-bottom: 5px;
}
.meter-labels span { font-size: 9px; color: #333; letter-spacing: 0.05em; }

.meter-bar {
  position: relative; height: 36px;
  background: #111; border-radius: 6px; overflow: hidden;
}

/* Tick marks */
.meter-ticks {
  position: absolute; inset: 0; pointer-events: none; z-index: 1;
}

.meter-centre {
  position: absolute; top: 0; bottom: 0; left: 50%;
  width: 2px; background: #2a2a2a; transform: translateX(-50%); z-index: 3;
}

.meter-fill {
  position: absolute; top: 0; bottom: 0;
  border-radius: 4px; z-index: 2;
  transition: left 0.12s ease, width 0.12s ease, background 0.5s ease, box-shadow 0.5s ease, top 0.3s ease, bottom 0.3s ease;
  display: none;
}

/* Cents readout */
.cents-row {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 10px;
}
.cents-num {
  font-size: 22px; font-weight: 600;
  color: #444; letter-spacing: -0.5px;
  transition: color var(--transition);
  min-width: 80px;
}
.cents-num.active { color: var(--col); }
.intune-badge {
  font-size: 12px; font-weight: 600;
  padding: 4px 12px; border-radius: 20px;
  background: transparent; border: 1px solid #333;
  color: #444;
  transition: all var(--transition);
  opacity: 0;
}
.intune-badge.active {
  opacity: 1;
  background: rgba(68,255,136,0.12);
  border-color: rgba(68,255,136,0.4);
  color: #44ff88;
}
.cents-hz {
  font-size: 11px; color: #444; text-align: right;
  transition: color var(--transition);
  min-width: 80px;
}
.cents-hz.active { color: #555; }

/* Divider */
.divider {
  height: 1px; background: #1e1e1e; margin: 4px 0;
}

/* Colour strip */
.colour-strip {
  display: flex; gap: 8px; margin-top: 2px;
}
.cs-item {
  flex: 1; height: 5px; border-radius: 3px;
  transition: opacity var(--transition), transform var(--transition);
  opacity: 0.2;
}
.cs-item.active { opacity: 1; transform: scaleY(1.6); }

/* Start button */
.start-btn {
  width: 100%; padding: 15px;
  border-radius: 12px; border: 1px solid #222;
  background: #151515; color: #888;
  font-size: 14px; cursor: pointer;
  letter-spacing: 0.03em;
  transition: all 0.2s;
}
.start-btn:hover { border-color: #333; color: #aaa; }
.start-btn:active { background: #1a1a1a; }

.status {
  font-size: 11px; color: #333; text-align: center;
  letter-spacing: 0.05em;
}

/* Colour themes — applied to :root dynamically */
</style>
</head>
<body>

<div class="glow" id="glow"></div>

<div class="app">
  <div class="header">
    <span class="title">Macro Tuner</span>
    <span class="colour-badge" id="colourBadge">—</span>
  </div>

  <div class="card" id="card">
    <div class="display-row">
      <div class="note-big" id="noteDisplay">—</div>
      <div class="degree-info">
        <div class="degree-num" id="degreeNum">Deg. —</div>
        <div class="degree-label" id="degreeLabel">—</div>
      </div>
    </div>

    <div class="freq-row" id="freqRow">— Hz</div>

    <div class="meter-wrap">
      <div class="meter-labels">
        <span>−62¢</span><span>flat</span><span>0</span><span>sharp</span><span>+62¢</span>
      </div>
      <div class="meter-bar" id="meterBar">
        <svg class="meter-ticks" viewBox="0 0 100 100" preserveAspectRatio="none">
          <!-- tick marks at ±25%, ±50%, centre -->
          <line x1="25" y1="20" x2="25" y2="80" stroke="#1e1e1e" stroke-width="1"/>
          <line x1="50" y1="10" x2="50" y2="90" stroke="#2a2a2a" stroke-width="1.5"/>
          <line x1="75" y1="20" x2="75" y2="80" stroke="#1e1e1e" stroke-width="1"/>
          <line x1="12.5" y1="30" x2="12.5" y2="70" stroke="#191919" stroke-width="0.8"/>
          <line x1="37.5" y1="30" x2="37.5" y2="70" stroke="#191919" stroke-width="0.8"/>
          <line x1="62.5" y1="30" x2="62.5" y2="70" stroke="#191919" stroke-width="0.8"/>
          <line x1="87.5" y1="30" x2="87.5" y2="70" stroke="#191919" stroke-width="0.8"/>
        </svg>
        <div class="meter-centre"></div>
        <div class="meter-fill" id="meterFill"></div>
      </div>
    </div>

    <div class="cents-row">
      <div class="cents-num" id="centsNum">—</div>
      <div class="intune-badge" id="intuneBadge">in tune</div>
      <div class="cents-hz" id="centsHz"></div>
    </div>

    <div class="divider" style="margin-top:16px;margin-bottom:12px;"></div>

    <div class="colour-strip">
      <div class="cs-item" id="cs_red"    style="background:#ff6b55;"></div>
      <div class="cs-item" id="cs_yellow" style="background:#ffd84a;"></div>
      <div class="cs-item" id="cs_green"  style="background:#4ed87a;"></div>
      <div class="cs-item" id="cs_blue"   style="background:#5ab4ff;"></div>
    </div>
  </div>

  <button class="start-btn" id="startBtn">Allow microphone access to start</button>
  <p class="status" style="margin-bottom:4px;">Transposition Mode</p>
  <select id="macroModeSelect" onchange="onMacroModeChange()"
    style="width:100%;padding:12px 14px;border-radius:12px;border:1px solid #222;background:#151515;color:#888;font-size:12px;letter-spacing:0.03em;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:center;">
  </select>
  <div style="display:flex;gap:8px;">
    <button class="start-btn" id="btnMidi"  onclick="setOctaveMode('midi')"  style="font-size:12px;padding:10px;">MIDI</button>
    <button class="start-btn" id="btnScore" onclick="setOctaveMode('score')" style="font-size:12px;padding:10px;">Score</button>
  </div>
  <p class="status" id="status">Tap to begin listening</p>
</div>

<script>
// ── Tuning system ─────────────────────────────────────────────
const BASE_FREQ = 261.63   // C3 Ableton = C4 Musescore = 261.63 Hz
const CENTS_PER_STEP = 125
const STD_NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']

// ── Macro transposition modes — matches the converter / QML plugin set ──
const MACRO_MODES = [
  { key:'standard',  label:'Standard',       offset:0,   desc:'' },
  { key:'4th_down',  label:'4th Down',       offset:-5,  desc:'Written a Perfect 4th below standard' },
  { key:'oct_down',  label:'Octave Down',    offset:-12, desc:'Written an octave below standard' },
  { key:'2oct_down', label:'2 Octaves Down', offset:-24, desc:'Written two octaves below standard' },
  { key:'oct_up',    label:'Octave Up',      offset:12,  desc:'Written an octave above standard' },
  { key:'5th_up',    label:'5th Up',         offset:7,   desc:'Written a Perfect 5th above standard' },
  { key:'m3_down',   label:'Minor 3rd Down', offset:-3,  desc:'Written a Minor 3rd below standard' },
]
let macroOffset = 0

const DEGREE_NAMES = [
  'Unison', 'Macro 2nd', 'Macro 3rd', 'Neutral 3rd',
  'Pure 4th', 'Wide Tritone', 'Macro 6th', 'Near Maj. 6th',
  'Pure Min. 7th', 'Wide Maj. 7th', 'Macro 9th', 'Macro 10th'
]

const COLOURS = [
  { name:'Red',    cls:'red',    text:'#ff6b55', bg:'#ff6b55', glow:'rgba(255,107,85,0.3)'  },
  { name:'Yellow', cls:'yellow', text:'#ffd84a', bg:'#ffd84a', glow:'rgba(255,216,74,0.3)'  },
  { name:'Green',  cls:'green',  text:'#4ed87a', bg:'#4ed87a', glow:'rgba(78,216,122,0.3)'  },
  { name:'Blue',   cls:'blue',   text:'#5ab4ff', bg:'#5ab4ff', glow:'rgba(90,180,255,0.3)'  },
]

let octaveMode = 'midi'

function setOctaveMode(mode) {
  octaveMode = mode
  const midi  = document.getElementById('btnMidi')
  const score = document.getElementById('btnScore')
  midi.style.color       = mode === 'midi'  ? '#eee' : '#555'
  midi.style.borderColor = mode === 'midi'  ? '#555' : '#222'
  score.style.color       = mode === 'score' ? '#eee' : '#555'
  score.style.borderColor = mode === 'score' ? '#555' : '#222'
  document.getElementById('status').textContent = mode === 'midi'
    ? 'MIDI octaves \u00b7 Middle C = C3'
    : 'Score octaves \u00b7 Middle C = C4'
}

function getNearestMacroDegree(freq) {
  const cents = 1200 * Math.log2(freq / BASE_FREQ)
  const stepNum = Math.round(cents / CENTS_PER_STEP)
  const nearestCents = stepNum * CENTS_PER_STEP
  const deviation = cents - nearestCents

  // Map macrotonal step → nearest standard semitone from C3
  // Verified against full conversion key spreadsheet across all octaves
  const stdSemitone = Math.round(stepNum * 125 / 100) + macroOffset
  const noteName  = STD_NOTES[((stdSemitone % 12) + 12) % 12]
  const abletonOct = 3 + Math.floor(stdSemitone / 12)
  const noteOctave = octaveMode === 'score' ? abletonOct + 1 : abletonOct

  const degInCycle  = ((stepNum % 12) + 12) % 12
  const colourGroup = degInCycle % 4
  const degreeNumber = degInCycle + 1

  return {
    deviation,
    degreeNumber,
    degreeLabel: DEGREE_NAMES[degInCycle],
    noteName,
    noteOctave,
    colourGroup,
    colour: COLOURS[colourGroup],
    targetFreq: BASE_FREQ * Math.pow(2, nearestCents / 1200),
  }
}

// ── Pitch detection (YIN algorithm — robust against subharmonics) ──
let timeBuf = null

function detectPitch(analyser, sampleRate) {
  if (!timeBuf || timeBuf.length !== analyser.fftSize) {
    timeBuf = new Float32Array(analyser.fftSize)
  }
  analyser.getFloatTimeDomainData(timeBuf)

  const SIZE = timeBuf.length
  const HALF = Math.floor(SIZE / 2)

  // RMS gate
  let rms = 0
  for (let i = 0; i < SIZE; i++) rms += timeBuf[i] * timeBuf[i]
  rms = Math.sqrt(rms / SIZE)
  if (rms < 0.01) return -1

  // YIN difference function
  const diff = new Float32Array(HALF)
  diff[0] = 0
  for (let tau = 1; tau < HALF; tau++) {
    let sum = 0
    for (let i = 0; i < HALF; i++) {
      const d = timeBuf[i] - timeBuf[i + tau]
      sum += d * d
    }
    diff[tau] = sum
  }

  // Cumulative mean normalised difference function
  const cmndf = new Float32Array(HALF)
  cmndf[0] = 1
  let runningSum = 0
  for (let tau = 1; tau < HALF; tau++) {
    runningSum += diff[tau]
    cmndf[tau] = runningSum > 0 ? diff[tau] * tau / runningSum : 1
  }

  // Find first dip below threshold — prefer shortest period (highest freq)
  const THRESHOLD = 0.15
  const minLag = Math.floor(sampleRate / 1200)  // max 1200 Hz
  const maxLag = Math.floor(sampleRate / 60)    // min 60 Hz

  let bestTau = -1
  for (let tau = minLag; tau < maxLag; tau++) {
    if (cmndf[tau] < THRESHOLD) {
      // Find local minimum
      while (tau + 1 < maxLag && cmndf[tau + 1] < cmndf[tau]) tau++
      bestTau = tau
      break
    }
  }

  // Fallback: global minimum if no dip found below threshold
  if (bestTau < 0) {
    let minVal = Infinity
    for (let tau = minLag; tau < maxLag; tau++) {
      if (cmndf[tau] < minVal) { minVal = cmndf[tau]; bestTau = tau }
    }
    if (minVal > 0.5) return -1  // not confident enough
  }

  // Parabolic interpolation for sub-sample accuracy
  if (bestTau > 0 && bestTau < HALF - 1) {
    const y1 = cmndf[bestTau - 1], y2 = cmndf[bestTau], y3 = cmndf[bestTau + 1]
    const denom = 2 * (2 * y2 - y1 - y3)
    const offset = denom !== 0 ? (y3 - y1) / denom : 0
    bestTau = bestTau + offset
  }

  return sampleRate / bestTau
}

// ── UI ─────────────────────────────────────────────────────────
const els = {
  glow:         document.getElementById('glow'),
  card:         document.getElementById('card'),
  badge:        document.getElementById('colourBadge'),
  noteDisplay:  document.getElementById('noteDisplay'),
  degreeNum:    document.getElementById('degreeNum'),
  degreeLabel:  document.getElementById('degreeLabel'),
  freqRow:      document.getElementById('freqRow'),
  meterFill:    document.getElementById('meterFill'),
  centsNum:     document.getElementById('centsNum'),
  centsHz:      document.getElementById('centsHz'),
  intuneBadge:  document.getElementById('intuneBadge'),
  csRed:        document.getElementById('cs_red'),
  csYellow:     document.getElementById('cs_yellow'),
  csGreen:      document.getElementById('cs_green'),
  csBlue:       document.getElementById('cs_blue'),
}

const csItems = [els.csRed, els.csYellow, els.csGreen, els.csBlue]

let currentColourGroup = -1

// Colour debounce — only change colour after holding a new group for N frames
let pendingColourGroup = -1
let pendingColourCount = 0
const COLOUR_DEBOUNCE = 6  // frames before committing to a colour change

function applyColour(group, colour) {
  // Debounce: only switch if we've seen this group consistently
  if (group !== currentColourGroup) {
    if (group === pendingColourGroup) {
      pendingColourCount++
      if (pendingColourCount < COLOUR_DEBOUNCE) return
    } else {
      pendingColourGroup = group
      pendingColourCount = 1
      return
    }
  }

  if (group === currentColourGroup) return
  currentColourGroup = group
  pendingColourGroup = -1
  pendingColourCount = 0

  // Update CSS variables for dynamic colouring
  document.documentElement.style.setProperty('--col', colour.text)
  document.documentElement.style.setProperty('--col-dim', colour.glow)

  // Badge
  els.badge.textContent = colour.name
  els.badge.style.color = colour.text
  els.badge.style.borderColor = colour.text + '55'
  els.badge.style.background = colour.text + '15'

  // Colour strip
  csItems.forEach((el, i) => {
    el.classList.toggle('active', i === group)
  })

  // Glow
  els.glow.style.background = `radial-gradient(ellipse at 50% 40%, ${colour.glow} 0%, transparent 70%)`
}

function updateMeter(cents) {
  const fill = els.meterFill
  // ±62.5¢ range (half a step either side)
  const range = CENTS_PER_STEP / 2
  const clamp = Math.max(-range, Math.min(range, cents))
  const needlePct = 50 + (clamp / range) * 50
  const leftPct = Math.min(50, needlePct)
  const widthPct = Math.abs(needlePct - 50)
  const abs = Math.abs(cents)
  const inTune = abs < 8
  const col = inTune ? '#44ff88' : abs < 20 ? '#ffcc00' : '#ff4444'

  fill.style.display = 'block'
  fill.style.left = leftPct + '%'
  fill.style.width = Math.max(widthPct, inTune ? 3 : 1) + '%'
  fill.style.background = col
  fill.style.top = inTune ? '0' : '25%'
  fill.style.bottom = inTune ? '0' : '25%'
  fill.style.boxShadow = inTune ? `0 0 10px ${col}, 0 0 20px ${col}66` : 'none'

  return inTune
}

function setActive(active) {
  els.card.classList.toggle('active', active)
  els.glow.classList.toggle('active', active)
  els.badge.classList.toggle('active', active)
  els.noteDisplay.classList.toggle('active', active)
  els.degreeNum.classList.toggle('active', active)
  els.degreeLabel.classList.toggle('active', active)
  els.freqRow.classList.toggle('active', active)
  els.centsNum.classList.toggle('active', active)
  els.centsHz.classList.toggle('active', active)
}

function updateDisplay(freq) {
  const d = getNearestMacroDegree(freq)
  const sc = Math.round(smoothCents)
  const abs = Math.abs(sc)
  const inTune = abs < 8

  applyColour(d.colourGroup, d.colour)
  setActive(true)

  els.noteDisplay.textContent = d.noteName + d.noteOctave
  els.degreeNum.textContent = 'Deg. ' + d.degreeNumber
  els.degreeLabel.textContent = d.degreeLabel
  els.freqRow.textContent = freq.toFixed(1) + ' Hz  ·  target ' + d.targetFreq.toFixed(1) + ' Hz'
  els.centsNum.textContent = (sc >= 0 ? '+' : '') + sc + '¢'
  els.centsHz.textContent = d.colour.name + ' group'
  els.intuneBadge.classList.toggle('active', inTune)

  updateMeter(smoothCents)
}

function clearDisplay() {
  setActive(false)
  currentColourGroup = -1
  document.documentElement.style.setProperty('--col', '#444')
  document.documentElement.style.setProperty('--col-dim', '#333')
  els.noteDisplay.textContent = '—'
  els.degreeNum.textContent = 'Deg. —'
  els.degreeLabel.textContent = '—'
  els.freqRow.textContent = '— Hz'
  els.centsNum.textContent = '—'
  els.centsHz.textContent = ''
  els.intuneBadge.classList.remove('active')
  els.meterFill.style.display = 'none'
  els.badge.textContent = '—'
  csItems.forEach(el => el.classList.remove('active'))
}

// ── Audio engine ───────────────────────────────────────────────
let audioCtx, analyser, running = false
let smoothFreq = 0, smoothActive = false, silenceCount = 0
let smoothCents = 0
const SILENCE_HOLD = 50

// Stability buffer — only commit to a pitch once readings agree
const STABILITY_SIZE = 8
const stabilityBuf = []

function stableFreq(rawFreq) {
  stabilityBuf.push(rawFreq)
  if (stabilityBuf.length > STABILITY_SIZE) stabilityBuf.shift()
  if (stabilityBuf.length < 3) return null
  const sorted = [...stabilityBuf].sort((a, b) => a - b)
  const median = sorted[Math.floor(sorted.length / 2)]
  const agree = stabilityBuf.filter(f => Math.abs(f / median - 1) < 0.15)
  if (agree.length < Math.ceil(stabilityBuf.length * 0.6)) return null
  return agree.reduce((a, b) => a + b, 0) / agree.length
}

document.getElementById('startBtn').addEventListener('click', async () => {
  if (running) return
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false })
    audioCtx = new (window.AudioContext || window.webkitAudioContext)()
    analyser = audioCtx.createAnalyser()
    analyser.fftSize = 8192
    analyser.smoothingTimeConstant = 0.5
    audioCtx.createMediaStreamSource(stream).connect(analyser)
    running = true
    document.getElementById('startBtn').style.display = 'none'
    document.getElementById('status').textContent = 'Listening'
    detect()
  } catch(e) {
    document.getElementById('status').textContent = 'Microphone access denied'
  }
})

function detect() {
  if (!running) return
  const rawFreq = detectPitch(analyser, audioCtx.sampleRate)

  if (rawFreq > 0) {
    silenceCount = 0
    const stable = stableFreq(rawFreq)
    if (stable !== null) {
      if (!smoothActive) {
        smoothFreq = stable
        smoothActive = true
        smoothCents = getNearestMacroDegree(stable).deviation  // seed immediately
      } else {
        const ratio = stable / smoothFreq
        if (ratio > 0.5 && ratio < 2.0) smoothFreq += 0.08 * (stable - smoothFreq)
      }
      const d = getNearestMacroDegree(smoothFreq)
      smoothCents += 0.25 * (d.deviation - smoothCents)
      updateDisplay(smoothFreq)
    }
  } else {
    silenceCount++
    if (silenceCount > SILENCE_HOLD) {
      smoothActive = false
      smoothCents = 0
      stabilityBuf.length = 0
      pendingColourGroup = -1
      pendingColourCount = 0
      clearDisplay()
    }
  }
  requestAnimationFrame(detect)
}

function initMacroModes() {
  const sel = document.getElementById('macroModeSelect')
  MACRO_MODES.forEach(m => {
    const o = document.createElement('option')
    o.value = m.key
    o.textContent = m.label
    sel.appendChild(o)
  })
}

function onMacroModeChange() {
  const m = MACRO_MODES.find(x => x.key === document.getElementById('macroModeSelect').value)
  macroOffset = m.offset
  document.getElementById('status').textContent = m.offset === 0
    ? 'Standard notation'
    : m.desc
}

initMacroModes()

// Init octave toggle
setOctaveMode('midi')
</script>
</body>
</html>
